[package]
name = "vizir_backend_imaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "imaging command-stream adapter for evaluated VizIR marks."
readme = "README.md"
keywords = ["visualization", "imaging", "charts"]
categories = ["graphics", "no-std"]

[dependencies]
hashbrown.workspace = true
imaging.workspace = true
parley = { workspace = true, optional = true, features = ["system"] }
vizir_core.workspace = true

[lints]
workspace = true

[features]
default = ["libm"]
std = ["imaging/std", "vizir_core/std"]
libm = ["imaging/libm", "vizir_core/libm"]
parley = ["std", "dep:parley"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
